name: release
on:
  push:
    tags: ["v*"]
jobs:
  binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run --with pyinstaller pyinstaller --onefile --name mojoanalyzer scripts/entry.py --paths src --collect-submodules mojoanalyzer
      - run: ./dist/mojoanalyzer --list-rules
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: mojoanalyzer-${{ matrix.name }}
          path: dist/mojoanalyzer*
  publish:
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          for d in */; do n=${d%/}; f=$(ls $d); cp "$d$f" "../${n}${f##mojoanalyzer}"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: mojoanalyzer-*
