[project]
name = "mojoanalyzer"
version = "0.1.0"
description = "Conservative static performance/idiom analyzer for Mojo source"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mojoanalyzer = "mojoanalyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojoanalyzer"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["compile: compiles fixtures with the real mojo toolchain (skipped if absent)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PERF", "PL", "C4"]
ignore = ["SIM102", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "PLC0415"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
